<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>캐시 무시 새로고침 도구 | GitHub Pages</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-brand {
      font-family: 'Outfit', sans-serif;
    }
    .glass-box {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }
    @keyframes spinPulse {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .spinning {
      animation: spinPulse 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

  <!-- 배경 글로우 효과 -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-cyan-600/20 rounded-full blur-3xl"></div>
  </div>

  <main class="relative z-10 w-full max-w-md glass-box rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center">
    
    <!-- 상단 아이콘 -->
    <div id="icon-container" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mb-5 text-indigo-400 shadow-inner">
      <svg id="refresh-icon" class="w-8 h-8 sm:w-10 sm:h-10 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
    </div>

    <!-- 타이틀 & 안내 -->
    <span class="px-3 py-1 text-[11px] font-bold uppercase tracking-wider rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-2">
      GitHub Pages Cache Cleaner
    </span>
    <h1 class="text-xl sm:text-2xl font-extrabold text-white mb-2 font-brand">
      캐시 무시 새로고침 도구
    </h1>
    <p class="text-xs sm:text-sm text-slate-400 leading-relaxed mb-6">
      깃허브 사이트에 코드를 새로 올렸는데 브라우저에 옛날 버전이 계속 뜰 때,
      저장된 모든 캐시와 서비스 워커를 비우고 최신 파일로 다시 불러옵니다.
    </p>

    <!-- 옵션: 개인 데이터 보존 여부 -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 mb-5 text-left flex items-center justify-between">
      <div>
        <div class="text-xs font-bold text-slate-200">운동 기록 및 개인 설정 보존</div>
        <div class="text-[11px] text-slate-400">루틴/세트 설정값은 지우지 않고 유지합니다.</div>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="keep-data-checkbox" checked class="sr-only peer">
        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
      </label>
    </div>

    <!-- 실시간 진행 상태 로그 박스 -->
    <div id="status-box" class="w-full bg-slate-950/70 border border-slate-800/80 rounded-xl p-3.5 mb-5 text-left font-mono text-[11px] text-slate-300 space-y-1.5 min-h-[92px]">
      <div id="log-init" class="flex items-center gap-2 text-slate-400">
        <span class="w-2 h-2 rounded-full bg-slate-600"></span>
        <span>대기 중: 버튼을 누르면 시작됩니다.</span>
      </div>
    </div>

    <!-- 실행 버튼 -->
    <button
      id="btn-run"
      onclick="runCleanAndReload()"
      class="w-full py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-bold text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition-all mb-4"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
      </svg>
      <span>저장된 캐시 무시하고 새로고침 실행</span>
    </button>

    <!-- 바로 이동 링크 버튼들 -->
    <div class="w-full grid grid-cols-2 gap-2 text-xs">
      <button
        type="button"
        onclick="runCleanAndReload('../index.html')"
        class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold transition-all flex items-center justify-center gap-1.5"
      >
        <span>🏠 메인 허브로</span>
      </button>
      <button
        type="button"
        onclick="runCleanAndReload('../운동앱/index.html')"
        class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold transition-all flex items-center justify-center gap-1.5"
      >
        <span>💪 운동앱으로</span>
      </button>
    </div>

    <div class="mt-4 text-[11px] text-slate-500">
      💡 팁: URL 끝에 <code>?auto=1</code>을 붙이면 접속 시 자동 실행됩니다.
    </div>

  </main>

  <script>
    // 상태 로그 추가 함수
    function addLog(text, status = 'info') {
      const box = document.getElementById('status-box');
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2';

      let dotColor = 'bg-indigo-400';
      if (status === 'success') dotColor = 'bg-emerald-400';
      if (status === 'warn') dotColor = 'bg-amber-400';

      row.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span class="${status === 'success' ? 'text-emerald-300 font-bold' : ''}">${text}</span>`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    // 캐시 무시 완전 새로고침 실행 함수
    async function runCleanAndReload(targetUrl = '../index.html') {
      const btn = document.getElementById('btn-run');
      const icon = document.getElementById('refresh-icon');
      const box = document.getElementById('status-box');
      const keepData = document.getElementById('keep-data-checkbox').checked;

      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      icon.classList.add('spinning');
      box.innerHTML = '';

      addLog('캐시 초기화 프로세스 시작...');

      // 1. 브라우저 서비스 워커 전체 등록 해제 (Unregister)
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length > 0) {
            for (let reg of registrations) {
              await reg.unregister();
              addLog(`서비스 워커 해제 완료 (${reg.scope})`, 'success');
            }
          } else {
            addLog('활성화된 서비스 워커 없음 (정상)');
          }
        }
      } catch (err) {
        addLog('서비스 워커 해제 건너뜀: ' + err.message, 'warn');
      }

      // 2. 브라우저 CacheStorage(캐시 스토리지) 전체 삭제
      try {
        if ('caches' in window) {
          const cacheKeys = await caches.keys();
          if (cacheKeys.length > 0) {
            for (let key of cacheKeys) {
              await caches.delete(key);
              addLog(`캐시 저장소 삭제 완료: ${key}`, 'success');
            }
          } else {
            addLog('삭제할 캐시 저장소 없음 (이미 비어있음)');
          }
        }
      } catch (err) {
        addLog('캐시 삭제 건너뜀: ' + err.message, 'warn');
      }

      // 3. 로컬스토리지 처리 (체크 해제 시 전체 삭제)
      if (!keepData) {
        try {
          localStorage.clear();
          sessionStorage.clear();
          addLog('로컬 저장소(운동 설정 포함) 전체 초기화 완료', 'success');
        } catch (e) {}
      } else {
        addLog('운동 기록 및 개인 설정 안전하게 보존됨', 'info');
      }

      addLog('✨ 최신 버전으로 캐시 우회 접속 준비 완료!', 'success');

      // 4. 타임스탬프 쿼리스트링(?nocache=...)을 붙여서 브라우저의 HTTP 디스크 캐시를 강제 무효화하고 최신 파일 로드
      const timestamp = Date.now();
      const targetWithBuster = targetUrl.includes('?') 
        ? `${targetUrl}&nocache=${timestamp}` 
        : `${targetUrl}?nocache=${timestamp}`;

      btn.innerHTML = `<span>완료! 최신 페이지로 이동 중...</span>`;

      setTimeout(() => {
        window.location.replace(targetWithBuster);
      }, 700);
    }

    // 만약 URL에 ?auto=1 파라미터가 있으면 접속 즉시 자동 실행
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('auto') === '1') {
        const dest = params.get('dest') === 'workout' ? '../운동앱/index.html' : '../index.html';
        runCleanAndReload(dest);
      }
    });
  </script>
</body>
</html>
