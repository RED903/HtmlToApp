<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617"> <!-- Tailwind slate-950 -->
  <title>운동 타이머</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      background-color: #020617; /* slate-950 */
      color: white;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    
    @keyframes alarmPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(239, 68, 68, 0.85); }
    }
    .animate-alarm-pulse {
      animation: alarmPulse 0.9s infinite ease-in-out;
    }

    @keyframes bellRing {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(15deg); }
      40% { transform: rotate(-15deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-10deg); }
    }
    .animate-bell-ring {
      animation: bellRing 0.7s infinite ease-in-out;
      transform-origin: top center;
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- 아이콘 컴포넌트 ---
    const Play = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const Pause = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
    const SkipForward = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>;
    const SkipBack = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>;
    const Check = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const PlayCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>;
    const RotateCcw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>;
    const Dumbbell = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m14.536 14.536-4.243-4.243"></path><path d="m12.414 16.657-2.121-2.122"></path><path d="m9.464 9.464 2.122 2.122"></path><path d="m4.515 11.05 4.95-4.95"></path><path d="m20.172 13.636-4.95 4.95"></path><path d="m17.343 7.98-2.121-2.121"></path><path d="m11.687 13.636 2.121 2.122"></path></svg>;
    const Sun = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.93 4.93l1.41 1.41"></path><path d="M17.66 17.66l1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M6.34 17.66l-1.41 1.41"></path><path d="M19.07 4.93l-1.41 1.41"></path></svg>;
    const Settings = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
    const Trash = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const Plus = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const X = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const ArrowUp = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>;
    const ArrowDown = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;
    const Bell = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>;
    const BellOff = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"></path><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
    const Volume2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
    const Zap = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
    const Smartphone = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>;

    // --- 기본 초기값 설정 ---
    const DEFAULT_REST_TIME = 120;
    const DEFAULT_ROUTINE = [
      { id: '1', name: '풀업', weight: '맨몸', reps: '12회', sets: 3, query: '풀업+자세' },
      { id: '2', name: '덤벨 프레스', weight: '14kg 양손', reps: '12회', sets: 3, query: '덤벨+프레스+자세' },
      { id: '3', name: '불가리안 스플릿 스쿼트', weight: '14kg 양손', reps: '각 12회', sets: 3, query: '불가리안+스플릿+스쿼트+자세' },
      { id: '4', name: '해머컬 & 이두컬', weight: '7.5kg 양손', reps: '해머 13회 + 이두 12회', sets: 3, query: '해머컬+이두컬+자세' },
      { id: '5', name: '원암 오버헤드 익스텐션', weight: '7.5kg', reps: '각 12회', sets: 3, query: '원암+오버헤드+익스텐션+자세' },
      { id: '6', name: '사레레', weight: '7.5kg 양손', reps: '12회', sets: 3, query: '사이드+레터럴+레이즈+자세' },
    ];

    const SOUND_OPTIONS = [
      { id: 'digital_timer', name: '디지털 타이머 비프 (권장)', desc: '또렷한 4연속 고주파 비프 경보음' },
      { id: 'crystal_bell', name: '크리스탈 차임벨', desc: '맑고 청아한 화음 벨소리' },
      { id: 'power_buzzer', name: '파워 스포츠 버저', desc: '체육관 스타일의 강력한 카운트 버저' }
    ];

    const STORAGE_KEY_ROUTINE = 'workout_routine_custom_v2';
    const STORAGE_KEY_REST_TIME = 'workout_rest_time_custom_v2';
    const STORAGE_KEY_SOUND_TYPE = 'workout_sound_type_v2';

    // 로컬 스토리지 불러오기
    function loadSavedRoutine() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_ROUTINE);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn('루틴 불러오기 실패:', e);
      }
      return DEFAULT_ROUTINE;
    }

    function loadSavedRestTime() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_REST_TIME);
        if (saved) {
          const num = parseInt(saved, 10);
          if (!isNaN(num) && num > 0) return num;
        }
      } catch (e) {
        console.warn('휴식시간 불러오기 실패:', e);
      }
      return DEFAULT_REST_TIME;
    }

    function loadSavedSoundType() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_SOUND_TYPE);
        if (saved && SOUND_OPTIONS.some(opt => opt.id === saved)) return saved;
      } catch (e) {}
      return 'digital_timer';
    }

    function App() {
      // --- 커스텀 데이터 상태 관리 ---
      const [routine, setRoutine] = useState(loadSavedRoutine);
      const [restTime, setRestTime] = useState(loadSavedRestTime);
      const [soundType, setSoundType] = useState(loadSavedSoundType);
      const [isSettingOpen, setIsSettingOpen] = useState(false);
      const [notifPermission, setNotifPermission] = useState(() => {
        return typeof Notification !== 'undefined' ? Notification.permission : 'unsupported';
      });

      // --- 타이머 및 알람 실행 상태 ---
      const [stepIndex, setStepIndex] = useState(-1);
      const [time, setTime] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      
      // 알람 울림 및 휴식 종료 대기 상태
      const [isAlarmActive, setIsAlarmActive] = useState(false);
      const [isRestCompletedWaiting, setIsRestCompletedWaiting] = useState(false);

      // 화면 켜짐 유지 상태
      const [wakeLockActive, setWakeLockActive] = useState(false);
      
      const audioCtxRef = useRef(null);
      const wakeLockRef = useRef(null);
      const alarmTimerRef = useRef(null);
      const videoKeepAliveRef = useRef(null);

      // 설정 임시 편집 상태 (모달용)
      const [tempRoutine, setTempRoutine] = useState(routine);
      const [tempRestTime, setTempRestTime] = useState(restTime);
      const [tempSoundType, setTempSoundType] = useState(soundType);

      // --- PWA 다운로드 및 설치 관리 ---
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
      const [isAppInstalled, setIsAppInstalled] = useState(() => {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      });

      useEffect(() => {
        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        };
        const handleAppInstalled = () => {
          setIsAppInstalled(true);
          setDeferredInstallPrompt(null);
          console.log('[운동앱] 앱 다운로드/설치 완료');
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        window.addEventListener('appinstalled', handleAppInstalled);

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);

      // 앱 다운로드/설치 실행 함수
      const handleInstallClick = async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const choiceResult = await deferredInstallPrompt.userChoice;
          if (choiceResult.outcome === 'accepted') {
            setIsAppInstalled(true);
            setDeferredInstallPrompt(null);
          }
        } else {
          // 브라우저 자체 설치 안내 (iOS Safari 또는 크롬 주소창)
          alert('📱 [운동앱 다운로드 안내]\n\n1. 스마트폰 브라우저 메뉴의 [홈 화면에 추가] 또는 [앱 설치]를 눌러주세요.\n(아이폰 사파리는 화면 하단 공유 아이콘 → [홈 화면에 추가] 선택)');
        }
      };

      // 루틴 변경 시 steps 동적 계산
      const steps = useMemo(() => {
        const result = [];
        routine.forEach((exercise, eIndex) => {
          const totalSets = Math.max(1, parseInt(exercise.sets, 10) || 1);
          for (let i = 1; i <= totalSets; i++) {
            result.push({
              type: 'workout',
              exerciseIndex: eIndex + 1,
              totalExercises: routine.length,
              name: exercise.name,
              weight: exercise.weight,
              reps: exercise.reps,
              set: i,
              totalSets: totalSets,
              query: exercise.query || exercise.name + '+자세'
            });
            
            const isLastExercise = eIndex === routine.length - 1 && i === totalSets;
            if (!isLastExercise) {
              result.push({
                type: 'rest',
                exerciseIndex: eIndex + 1,
                totalExercises: routine.length,
                name: exercise.name,
                weight: exercise.weight,
                reps: exercise.reps,
                set: i,
                totalSets: totalSets,
                query: exercise.query || exercise.name + '+자세'
              });
            }
          }
        });
        return result;
      }, [routine]);

      // 시스템 알림 권한 요청
      const requestNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          alert('이 브라우저는 시스템 알림을 지원하지 않습니다.');
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          setNotifPermission(perm);
          if (perm === 'granted') {
            triggerSystemNotification('🔔 알림 설정 완료!', '휴식이 끝나면 시스템 알림음과 진동으로 알려드립니다.');
          }
        } catch (e) {
          console.warn('알림 권한 요청 실패:', e);
        }
      };

      // 시스템 알림(스마트폰 알림 음량 스트림) 발송
      const triggerSystemNotification = useCallback((title, body) => {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;

        // ServiceWorker를 통한 OS 시스템 알림 발송 (알림 음량 채널 사용)
        if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then((reg) => {
            reg.showNotification(title, {
              body: body,
              icon: './icon-192.png',
              badge: './icon-192.png',
              vibrate: [300, 100, 300, 100, 400],
              tag: 'workout-alarm-tag',
              renotify: true,
              requireInteraction: true,
              silent: false
            }).catch(() => {});
          });
        } else {
          try {
            new Notification(title, {
              body: body,
              icon: './icon-192.png',
              vibrate: [300, 100, 300, 100, 400],
              tag: 'workout-alarm-tag',
              silent: false
            });
          } catch(e) {}
        }
      }, []);

      // 열려있는 시스템 알림 닫기
      const closeSystemNotifications = useCallback(() => {
        if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then((reg) => {
            reg.getNotifications({ tag: 'workout-alarm-tag' }).then((notifications) => {
              notifications.forEach((n) => n.close());
            }).catch(() => {});
          });
        }
      }, []);

      // --- 화면 꺼짐 방지 (Wake Lock + Video Fallback) ---
      const requestWakeLock = useCallback(async () => {
        try {
          if ('wakeLock' in navigator) {
            if (wakeLockRef.current !== null) {
              try { await wakeLockRef.current.release(); } catch(e){}
            }
            wakeLockRef.current = await navigator.wakeLock.request('screen');
            setWakeLockActive(true);
            wakeLockRef.current.addEventListener('release', () => {
              setWakeLockActive(false);
            });
          }
        } catch (err) {
          console.warn('Wake Lock 미지원 또는 오류:', err);
          setWakeLockActive(false);
        }

        // iOS 및 미지원 환경용 백업 Fallback 비디오
        try {
          if (!videoKeepAliveRef.current) {
            const video = document.createElement('video');
            video.setAttribute('playsinline', '');
            video.setAttribute('muted', '');
            video.muted = true;
            video.loop = true;
            video.src = 'data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAAhmcmVlAAAAEG1kYXQAAAEA//+A';
            video.style.position = 'fixed';
            video.style.width = '1px';
            video.style.height = '1px';
            video.style.opacity = '0.01';
            video.style.pointerEvents = 'none';
            document.body.appendChild(video);
            videoKeepAliveRef.current = video;
          }
          if (videoKeepAliveRef.current && videoKeepAliveRef.current.paused) {
            videoKeepAliveRef.current.play().catch(() => {});
          }
        } catch(e) {}
      }, []);

      const releaseWakeLock = useCallback(() => {
        if (wakeLockRef.current !== null) {
          wakeLockRef.current.release().catch(() => {});
          wakeLockRef.current = null;
        }
        if (videoKeepAliveRef.current) {
          try {
            videoKeepAliveRef.current.pause();
          } catch(e){}
        }
        setWakeLockActive(false);
      }, []);

      // 화면 복귀 및 사용자 인터랙션 시 Wake Lock 자동 복원
      useEffect(() => {
        const handleVisibilityChange = async () => {
          if (document.visibilityState === 'visible' && stepIndex >= 0 && stepIndex < steps.length) {
            await requestWakeLock();
          }
        };
        const handleUserTouch = async () => {
          if (stepIndex >= 0 && stepIndex < steps.length && !wakeLockActive) {
            await requestWakeLock();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('touchstart', handleUserTouch, { passive: true });
        window.addEventListener('click', handleUserTouch, { passive: true });

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('touchstart', handleUserTouch);
          window.removeEventListener('click', handleUserTouch);
          releaseWakeLock();
        };
      }, [stepIndex, steps.length, wakeLockActive, requestWakeLock, releaseWakeLock]);

      // --- 오디오 엔진 (Web Audio API 고품질 알람 사운드 합성) ---
      const initAudio = useCallback(() => {
        try {
          if (!audioCtxRef.current) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtxRef.current = ctx;
          }
          if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
        } catch(e) {
          console.warn('오디오 초기화 오류:', e);
        }
      }, []);

      // 알람 소리 생성기
      const playSingleAlarmBeep = useCallback((typeToPlay = soundType) => {
        initAudio();
        if (!audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const now = ctx.currentTime;

        // 1. 디지털 타이머 비프 (삐-삐-삐-삐! 고주파 듀얼 펄스 경보음)
        if (typeToPlay === 'digital_timer') {
          const beeps = [0, 0.12, 0.24, 0.36];
          beeps.forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(2800, now + delay);

            gain.gain.setValueAtTime(0.35, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.08);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + delay);
            osc.stop(now + delay + 0.085);
          });
        }
        // 2. 크리스탈 차임벨 (딩-동! 맑고 울림 있는 종소리)
        else if (typeToPlay === 'crystal_bell') {
          const chords = [
            { freq: 880, delay: 0, dur: 0.8 },
            { freq: 1760, delay: 0, dur: 0.5 },
            { freq: 1174.66, delay: 0.18, dur: 0.9 },
            { freq: 2349.32, delay: 0.18, dur: 0.6 }
          ];
          chords.forEach(({ freq, delay, dur }) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + delay);

            gain.gain.setValueAtTime(0.4, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + delay);
            osc.stop(now + delay + dur);
          });
        }
        // 3. 파워 스포츠 버저 (낮고 강렬한 체육관 카운트 버저)
        else if (typeToPlay === 'power_buzzer') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'square';
          osc1.frequency.setValueAtTime(600, now);
          osc2.frequency.setValueAtTime(605, now);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.6);
          osc2.stop(now + 0.6);
        }

        // 모바일 기기 진동
        if ('vibrate' in navigator) {
          try {
            navigator.vibrate([250, 100, 250, 100, 300]);
          } catch(e){}
        }
      }, [soundType, initAudio]);

      // 지속 알람 시작 (사용자가 끌 때까지 반복 울림)
      const startContinuousAlarm = useCallback(() => {
        setIsAlarmActive(true);
        setIsRestCompletedWaiting(true);
        
        // 1) 시스템 알림 발송 (스마트폰 알림 음량 채널)
        const nextStepInfo = stepIndex + 1 < steps.length ? steps[stepIndex + 1] : null;
        const msg = nextStepInfo 
          ? `다음: ${nextStepInfo.name} (${nextStepInfo.set}세트)` 
          : '휴식이 완료되었습니다. 운동을 시작하세요!';
        triggerSystemNotification('🔔 휴식 시간 종료!', msg);

        // 2) 브라우저 포그라운드 사운드 재생
        playSingleAlarmBeep();

        if (alarmTimerRef.current) clearInterval(alarmTimerRef.current);
        let count = 0;
        alarmTimerRef.current = setInterval(() => {
          count++;
          if (count > 60) {
            stopAlarm();
            return;
          }
          playSingleAlarmBeep();
        }, 1100);
      }, [stepIndex, steps, playSingleAlarmBeep, triggerSystemNotification]);

      // 알람 끄기 (소리와 시스템 알림만 멈추고 운동 시작 대기 유지)
      const stopAlarm = useCallback(() => {
        if (alarmTimerRef.current) {
          clearInterval(alarmTimerRef.current);
          alarmTimerRef.current = null;
        }
        setIsAlarmActive(false);
        closeSystemNotifications();
      }, [closeSystemNotifications]);

      // 휴식 타이머 카운트다운
      useEffect(() => {
        let interval = null;
        const currentStep = steps[stepIndex];
        
        if (isRunning && currentStep?.type === 'rest') {
          interval = setInterval(() => {
            setTime((prevTime) => {
              if (prevTime <= 1) {
                clearInterval(interval);
                setIsRunning(false);
                startContinuousAlarm();
                return 0;
              }
              return prevTime - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isRunning, stepIndex, steps, startContinuousAlarm]);

      // 다음 단계로 이동
      const handleNextStep = async () => {
        stopAlarm();
        setIsRestCompletedWaiting(false);

        if (stepIndex === -1) {
          initAudio();
          await requestWakeLock();
          // 첫 시작 시 알림 권한이 default면 물어보기
          if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
            requestNotificationPermission();
          }
        }
        
        if (stepIndex >= steps.length - 1) {
          setStepIndex(steps.length);
          setIsRunning(false);
          releaseWakeLock();
          return;
        }

        const nextIdx = stepIndex + 1;
        setStepIndex(nextIdx);
        
        if (steps[nextIdx].type === 'rest') {
          setTime(restTime);
          setIsRunning(true);
        } else {
          setTime(0);
          setIsRunning(false);
        }
      };

      // 알람 끄고 바로 다음 운동 시작
      const handleStopAlarmAndStart = async () => {
        stopAlarm();
        await handleNextStep();
      };

      const handlePrevStep = () => {
        stopAlarm();
        setIsRestCompletedWaiting(false);

        if (stepIndex <= 0) {
          setStepIndex(-1);
          setTime(0);
          setIsRunning(false);
          releaseWakeLock();
          return;
        }

        const prevIdx = stepIndex - 1;
        setStepIndex(prevIdx);
        
        if (steps[prevIdx].type === 'rest') {
          setTime(restTime);
          setIsRunning(true);
        } else {
          setTime(0);
          setIsRunning(false);
        }
      };

      const toggleTimer = () => {
        const currentStep = steps[stepIndex];
        if (currentStep?.type === 'rest' && !isAlarmActive && !isRestCompletedWaiting) {
          setIsRunning(!isRunning);
        }
      };

      const resetWorkout = () => {
        stopAlarm();
        setIsRestCompletedWaiting(false);
        setStepIndex(-1);
        setTime(0);
        setIsRunning(false);
        releaseWakeLock();
      };

      const formatTime = (seconds) => {
        const m = Math.floor(Math.abs(seconds) / 60).toString().padStart(2, '0');
        const s = (Math.abs(seconds) % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // --- 설정 모달 열기 & 저장 로직 ---
      const openSettings = () => {
        setTempRoutine(JSON.parse(JSON.stringify(routine)));
        setTempRestTime(restTime);
        setTempSoundType(soundType);
        setIsSettingOpen(true);
      };

      const saveSettings = () => {
        const validTime = Math.max(5, parseInt(tempRestTime, 10) || DEFAULT_REST_TIME);
        const validRoutine = tempRoutine.map(item => ({
          ...item,
          name: item.name.trim() || '새 운동',
          sets: Math.max(1, parseInt(item.sets, 10) || 1),
          query: item.query ? item.query.trim() : item.name.trim() + '+자세'
        }));

        setRoutine(validRoutine);
        setRestTime(validTime);
        setSoundType(tempSoundType);

        try {
          localStorage.setItem(STORAGE_KEY_ROUTINE, JSON.stringify(validRoutine));
          localStorage.setItem(STORAGE_KEY_REST_TIME, validTime.toString());
          localStorage.setItem(STORAGE_KEY_SOUND_TYPE, tempSoundType);
        } catch (e) {
          console.error('설정 저장 실패:', e);
        }

        setIsSettingOpen(false);
        resetWorkout();
      };

      const resetToDefault = () => {
        if (window.confirm('기본 운동 루틴, 휴식 시간(120초), 알람음으로 초기화하시겠습니까?')) {
          setTempRoutine(JSON.parse(JSON.stringify(DEFAULT_ROUTINE)));
          setTempRestTime(DEFAULT_REST_TIME);
          setTempSoundType('digital_timer');
        }
      };

      const handleAddExercise = () => {
        const newId = Date.now().toString();
        setTempRoutine([...tempRoutine, {
          id: newId,
          name: '새 운동',
          weight: '10kg',
          reps: '10회',
          sets: 3,
          query: '운동+자세'
        }]);
      };

      const handleRemoveExercise = (idx) => {
        if (tempRoutine.length <= 1) {
          alert('최소 1개 이상의 운동이 있어야 합니다.');
          return;
        }
        setTempRoutine(tempRoutine.filter((_, i) => i !== idx));
      };

      const handleMoveExercise = (idx, direction) => {
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= tempRoutine.length) return;
        const copy = [...tempRoutine];
        const temp = copy[idx];
        copy[idx] = copy[newIdx];
        copy[newIdx] = temp;
        setTempRoutine(copy);
      };

      const handleExerciseChange = (idx, field, value) => {
        const copy = [...tempRoutine];
        copy[idx][field] = value;
        if (field === 'name' && (!copy[idx].query || copy[idx].query.endsWith('+자세'))) {
          copy[idx].query = value + '+자세';
        }
        setTempRoutine(copy);
      };

      const currentStep = steps[stepIndex];
      const nextStep = stepIndex + 1 < steps.length ? steps[stepIndex + 1] : null;
      const isFinished = stepIndex >= steps.length;
      const isIdle = stepIndex === -1;

      // 동적 배경 테마
      let bgTheme = "bg-slate-900 border-slate-800";
      if (isAlarmActive) {
        bgTheme = "bg-red-950/90 border-red-500/80 shadow-[0_0_35px_rgba(239,68,68,0.4)]";
      } else if (isRestCompletedWaiting) {
        bgTheme = "bg-amber-950/80 border-amber-500/60 shadow-[0_0_25px_rgba(245,158,11,0.3)]";
      } else if (currentStep?.type === 'workout') {
        bgTheme = "bg-slate-900 border-indigo-500/30";
      } else if (currentStep?.type === 'rest') {
        bgTheme = "bg-emerald-950 border-emerald-500/40";
      } else if (isFinished) {
        bgTheme = "bg-blue-950 border-blue-500/40";
      }

      return (
        <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center p-2 sm:p-4 font-sans select-none relative overflow-x-hidden">
          
          {/* 메인 타이머 카드 박스 */}
          <div className={`w-full max-w-[440px] aspect-square ${bgTheme} border-2 rounded-2xl sm:rounded-3xl flex flex-col justify-between shadow-2xl p-3 sm:p-5 relative transition-all duration-300 overflow-hidden`}>
            
            {/* 상단 헤더 */}
            <div className="flex items-center justify-between text-xs text-gray-400 border-b border-white/10 pb-1.5 shrink-0">
              <div className="flex items-center gap-1.5">
                <a 
                  href="../index.html" 
                  title="메인 허브로 돌아가기" 
                  className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center gap-1 text-[10px] transition-colors"
                >
                  🏠 홈
                </a>
                <a 
                  href="../새로고침/index.html?dest=workout" 
                  title="캐시 비우고 최신 버전으로 새로고침" 
                  className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-indigo-300 border border-slate-700 flex items-center gap-1 text-[10px] transition-colors"
                >
                  🔄
                </a>
                
                {/* PWA 앱 다운로드/설치 버튼 (설치 안 된 웹 브라우저 상태일 때 표시) */}
                {!isAppInstalled && (
                  <button
                    onClick={handleInstallClick}
                    title="이 운동앱을 스마트폰이나 PC에 단독 앱으로 설치합니다"
                    className="px-2 py-0.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold flex items-center gap-1 text-[10px] transition-all shadow-sm active:scale-95 animate-pulse"
                  >
                    <span>📲 앱 설치</span>
                  </button>
                )}

                <div className="flex items-center gap-1 font-bold text-gray-200">
                  <Dumbbell className="w-3.5 h-3.5 text-indigo-400" />
                  <span>운동 루틴</span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                {/* 시스템 알림 권한 상태 및 요청 */}
                {notifPermission !== 'granted' && (
                  <button
                    onClick={requestNotificationPermission}
                    title="스마트폰 시스템 알림음(알림 볼륨) 허용하기"
                    className="flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition-all animate-pulse"
                  >
                    <Smartphone className="w-3 h-3" />
                    <span>알림음 허용</span>
                  </button>
                )}

                {/* 화면 켜짐 유지 토글 버튼 */}
                <button
                  onClick={wakeLockActive ? releaseWakeLock : requestWakeLock}
                  title="화면 꺼짐 방지 (클릭하여 켜기/끄기)"
                  className={`flex items-center gap-1 text-[10px] sm:text-xs px-2 py-0.5 rounded-full border transition-all ${
                    wakeLockActive 
                      ? 'text-emerald-400 bg-emerald-500/15 border-emerald-500/30' 
                      : 'text-gray-400 bg-slate-800 border-slate-700 hover:text-gray-200'
                  }`}
                >
                  <Sun className={`w-3 h-3 ${wakeLockActive ? 'animate-spin text-emerald-400' : ''}`} />
                  <span>{wakeLockActive ? '화면켜짐' : '화면유지OFF'}</span>
                </button>

                {!isIdle && !isFinished && (
                  <span className={`text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold ${
                    isAlarmActive
                      ? 'bg-red-500/30 text-red-300 border border-red-500/50 animate-pulse'
                      : isRestCompletedWaiting
                      ? 'bg-amber-500/30 text-amber-300 border border-amber-500/50'
                      : currentStep.type === 'workout' 
                      ? 'bg-indigo-500/20 text-indigo-300' 
                      : 'bg-emerald-500/20 text-emerald-300'
                  }`}>
                    {currentStep.exerciseIndex} / {routine.length}
                  </span>
                )}

                {/* 루틴 커스텀 설정 버튼 */}
                <button
                  onClick={openSettings}
                  title="루틴 및 알람 소리 수정"
                  className="p-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/80 transition-all active:scale-95 flex items-center gap-1 text-[10px]"
                >
                  <Settings className="w-3.5 h-3.5 text-indigo-400" />
                  <span>설정</span>
                </button>
              </div>
            </div>

            {/* 중앙 컨텐츠 영역 */}
            <div className="flex-1 flex flex-col items-center justify-center text-center my-auto py-1 overflow-hidden">
              
              {/* 1. 시작 전 (대기) 화면 */}
              {isIdle && (
                <div className="animate-fade-in flex flex-col items-center justify-center">
                  <h2 className="text-xl sm:text-2xl font-black text-white mb-1">운동 시작하기</h2>
                  <p className="text-gray-400 text-xs mb-3 leading-relaxed">
                    총 <strong className="text-indigo-300">{routine.length}개 운동</strong> · 총 <strong className="text-indigo-300">{steps.filter(s => s.type === 'workout').length}세트</strong><br/>
                    <span className="text-emerald-400 font-medium">휴식 {restTime}초 · 화면 꺼짐 방지 · 시스템 알림음</span>
                  </p>
                  <div 
                    onClick={handleNextStep}
                    className="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-indigo-600/20 hover:bg-indigo-600/30 border-4 border-indigo-500 flex items-center justify-center cursor-pointer transition-transform active:scale-95 shadow-[0_0_25px_rgba(99,102,241,0.3)]"
                  >
                    <Play className="w-10 h-10 text-indigo-400 ml-1" />
                  </div>
                </div>
              )}

              {/* 2. 진행 중 공통 세트 프로그레스 바 */}
              {!isIdle && !isFinished && (
                <div className="flex flex-col items-center mb-2 shrink-0">
                  <div className="flex items-center gap-1.5 mb-1 max-w-[280px] overflow-x-auto py-0.5">
                    {Array.from({ length: currentStep.totalSets }).map((_, idx) => {
                      const setNum = idx + 1;
                      const isCurrent = setNum === currentStep.set;
                      const isDone = setNum < currentStep.set;
                      return (
                        <div
                          key={idx}
                          className={`h-2 rounded-full transition-all duration-300 ${
                            isCurrent
                              ? isAlarmActive
                                ? 'w-7 bg-red-400 shadow-[0_0_10px_rgba(248,113,113,0.9)] animate-pulse'
                                : currentStep.type === 'workout'
                                ? 'w-7 bg-indigo-400 shadow-[0_0_10px_rgba(129,140,248,0.8)]'
                                : 'w-7 bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)]'
                              : isDone
                              ? 'w-2 bg-indigo-600/60'
                              : 'w-2 bg-gray-700'
                          }`}
                        />
                      );
                    })}
                  </div>

                  <span className={`text-xs sm:text-sm font-black tracking-widest uppercase px-3.5 py-0.5 rounded-full border shadow-md ${
                    isAlarmActive
                      ? 'text-red-200 bg-red-950/80 border-red-500/50'
                      : isRestCompletedWaiting
                      ? 'text-amber-200 bg-amber-950/80 border-amber-500/50'
                      : currentStep.type === 'workout'
                      ? 'text-indigo-200 bg-indigo-900/60 border-indigo-400/40'
                      : 'text-emerald-200 bg-emerald-900/60 border-emerald-400/40'
                  }`}>
                    {currentStep.set} / {currentStep.totalSets} 세트 {currentStep.type === 'rest' && '(휴식)'}
                  </span>
                </div>
              )}

              {/* 3. 운동 진행 중 카드 */}
              {!isIdle && !isFinished && currentStep?.type === 'workout' && (
                <div className="animate-fade-in w-full flex flex-col items-center justify-center px-2 my-auto">
                  <div className="w-full bg-slate-800/80 border border-indigo-500/40 rounded-2xl p-3 sm:p-4 shadow-lg backdrop-blur-sm flex flex-col items-center justify-center">
                    <span className="text-[10px] text-indigo-400 font-bold uppercase tracking-wider mb-1">
                      진행 중인 운동
                    </span>
                    <a 
                      href={`https://www.youtube.com/results?search_query=${currentStep.query}`} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="text-xl sm:text-2xl font-black text-blue-300 hover:text-blue-100 underline decoration-blue-400/60 underline-offset-4 transition-all text-center leading-tight line-clamp-2 mb-2"
                    >
                      {currentStep.name} 🔗
                    </a>

                    {/* 커스텀 무게 및 횟수 배지 */}
                    <div className="flex items-center gap-2 text-xs font-semibold">
                      {currentStep.weight && (
                        <span className="px-2.5 py-1 rounded-lg bg-indigo-950/70 border border-indigo-500/30 text-indigo-200">
                          ⚖️ {currentStep.weight}
                        </span>
                      )}
                      {currentStep.reps && (
                        <span className="px-2.5 py-1 rounded-lg bg-purple-950/70 border border-purple-500/30 text-purple-200">
                          🔁 {currentStep.reps}
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* 4. 휴식 중 화면 또는 휴식 완료 알람 상태 */}
              {!isIdle && !isFinished && currentStep?.type === 'rest' && (
                <div className="animate-fade-in w-full flex flex-col items-center justify-center my-auto">
                  
                  {/* (A) 알람 울림 상태 (휴식 시간 0초 도달) */}
                  {isAlarmActive ? (
                    <div className="flex flex-col items-center justify-center">
                      <div className="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-red-900/50 border-4 border-red-500 flex flex-col items-center justify-center shadow-[0_0_35px_rgba(239,68,68,0.6)] animate-alarm-pulse mb-2">
                        <Bell className="w-10 h-10 sm:w-12 sm:h-12 text-red-400 animate-bell-ring" />
                        <span className="text-[10px] text-red-300 font-bold tracking-wider mt-1">휴식 완료!</span>
                      </div>
                      <p className="text-xs sm:text-sm font-black text-red-300 animate-pulse">
                        🔔 알람이 울리고 있습니다!
                      </p>
                    </div>
                  ) : isRestCompletedWaiting ? (
                    /* (B) 알람 끈 후 운동 시작 대기 상태 */
                    <div className="flex flex-col items-center justify-center px-3">
                      <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-amber-950/60 border-4 border-amber-400/80 flex flex-col items-center justify-center shadow-[0_0_25px_rgba(245,158,11,0.3)] mb-2">
                        <Dumbbell className="w-8 h-8 text-amber-300 animate-bounce" />
                        <span className="text-[10px] text-amber-200 font-bold mt-0.5">휴식 종료</span>
                      </div>
                      <h3 className="text-sm sm:text-base font-extrabold text-amber-200">
                        {nextStep ? `다음: ${nextStep.name} (${nextStep.set}세트)` : '다음 운동 준비'}
                      </h3>
                      <p className="text-xs text-amber-300/80 mt-0.5">
                        호흡을 가다듬고 시작 버튼을 누르세요!
                      </p>
                    </div>
                  ) : (
                    /* (C) 일반 휴식 타이머 카운트다운 */
                    <div className="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-emerald-900/40 border-4 border-emerald-500 flex flex-col items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.3)] relative">
                      <span className="text-[10px] sm:text-xs text-emerald-300 font-bold tracking-wider mb-0.5">휴식 타이머</span>
                      <span className="text-3xl sm:text-4xl font-black tracking-tighter text-white">
                        {formatTime(time)}
                      </span>
                      {!isRunning && (
                        <span className="absolute bottom-2 text-red-400 text-[9px] font-bold animate-pulse">일시정지</span>
                      )}
                    </div>
                  )}

                </div>
              )}

              {/* 5. 운동 완료 화면 */}
              {isFinished && (
                <div className="animate-fade-in flex flex-col items-center justify-center">
                  <div className="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-blue-600/20 border-4 border-blue-400 flex items-center justify-center shadow-[0_0_25px_rgba(59,130,246,0.4)] mb-2">
                    <Check className="w-12 h-12 text-blue-300" />
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black text-blue-200">오늘 운동 완료!</h2>
                  <p className="text-xs text-blue-300/80 mt-0.5">수고하셨습니다 👏</p>
                </div>
              )}

            </div>

            {/* 하단 컨트롤 버튼 바 */}
            <div className="pt-1.5 border-t border-white/10 flex flex-col gap-1.5 shrink-0">
              
              {/* 알람 울림 중일 때의 전용 버튼 */}
              {isAlarmActive ? (
                <div className="flex flex-col gap-1.5">
                  <button
                    onClick={stopAlarm}
                    className="w-full py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] shadow-lg bg-red-600 hover:bg-red-500 text-white animate-pulse"
                  >
                    <BellOff className="w-4 h-4"/> [1] 🔔 알람 소리 끄기
                  </button>
                  <button
                    onClick={handleStopAlarmAndStart}
                    className="w-full py-2 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-400/40"
                  >
                    <Zap className="w-3.5 h-3.5"/> 알람 끄고 바로 운동 시작
                  </button>
                </div>
              ) : isRestCompletedWaiting ? (
                /* 알람 끈 후 운동 시작 대기 버튼 */
                <div className="flex flex-col gap-1.5">
                  <button
                    onClick={handleNextStep}
                    className="w-full py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] shadow-lg bg-indigo-600 hover:bg-indigo-500 text-white animate-bounce"
                  >
                    <Play className="w-4 h-4"/> [1] ▶️ 다음 세트 운동 시작!
                  </button>
                </div>
              ) : (
                /* 일반 모드 메인 버튼 */
                <button
                  onClick={isFinished ? resetWorkout : handleNextStep}
                  className={`w-full py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] shadow-md
                    ${isIdle 
                      ? 'bg-indigo-600 hover:bg-indigo-500 text-white' 
                      : isFinished 
                        ? 'bg-gray-800 hover:bg-gray-700 text-gray-200'
                        : currentStep?.type === 'workout'
                          ? 'bg-indigo-600 hover:bg-indigo-500 text-white'
                          : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                    }`}
                >
                  {isIdle && <><PlayCircle className="w-4 h-4"/> [1] 운동 시작하기</>}
                  {isFinished && <><RotateCcw className="w-4 h-4"/> [1] 루틴 처음으로</>}
                  {!isIdle && !isFinished && currentStep?.type === 'workout' && <><Check className="w-4 h-4"/> [1] 세트 완료 (휴식 시작)</>}
                  {!isIdle && !isFinished && currentStep?.type === 'rest' && <><SkipForward className="w-4 h-4"/> [1] 휴식 건너뛰기</>}
                </button>
              )}

              {/* 하단 보조 버튼 (뒤로 / 일시정지) */}
              {(!isAlarmActive && !isRestCompletedWaiting) && (
                <div className="flex gap-1.5">
                  <button
                    onClick={handlePrevStep}
                    disabled={isIdle || stepIndex <= 0}
                    className="flex-1 py-2 sm:py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 flex items-center justify-center gap-1 text-[11px] sm:text-xs font-bold text-gray-300 transition-all active:scale-[0.98]"
                  >
                    <SkipBack className="w-3.5 h-3.5"/> [2] 뒤로
                  </button>
                  
                  <button
                    onClick={toggleTimer}
                    disabled={isIdle || isFinished || currentStep?.type !== 'rest'}
                    className={`flex-1 py-2 sm:py-2.5 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1 transition-all active:scale-[0.98] disabled:opacity-30
                      ${isRunning ? 'bg-amber-900/70 text-amber-200 hover:bg-amber-800' : 'bg-slate-700 text-white hover:bg-slate-600'}
                    `}
                  >
                    {isRunning && currentStep?.type === 'rest' ? (
                      <><Pause className="w-3.5 h-3.5"/> [3] 일시정지</>
                    ) : (
                      <><Play className="w-3.5 h-3.5"/> [3] 재생</>
                    )}
                  </button>
                </div>
              )}

            </div>

          </div>

          {/* ⚙️ [모달] 루틴, 휴식시간 및 알람음 설정 창 */}
          {isSettingOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-fade-in">
                
                {/* 모달 헤더 */}
                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
                  <div className="flex items-center gap-2">
                    <Settings className="w-5 h-5 text-indigo-400" />
                    <h3 className="font-bold text-sm sm:text-base text-white">운동 설정 및 알람음</h3>
                  </div>
                  <button 
                    onClick={() => setIsSettingOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {/* 모달 본문 스크롤 영역 */}
                <div className="p-4 overflow-y-auto space-y-4 text-xs sm:text-sm flex-1">
                  
                  {/* PWA 앱 다운로드/설치 안내 카드 */}
                  {!isAppInstalled ? (
                    <div className="bg-gradient-to-r from-indigo-950/80 to-slate-900 border border-indigo-500/40 rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-lg">
                      <div>
                        <div className="font-bold text-xs sm:text-sm text-indigo-300 flex items-center gap-1.5">
                          <span>📲 운동앱 다운로드 (홈 화면에 설치)</span>
                        </div>
                        <p className="text-[11px] text-slate-400 mt-0.5">
                          스마트폰/PC에 설치하면 인터넷 없이도 바로 실행됩니다.
                        </p>
                      </div>
                      <button
                        onClick={handleInstallClick}
                        className="shrink-0 px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-md shadow-indigo-600/30 active:scale-95 flex items-center gap-1"
                      >
                        다운로드
                      </button>
                    </div>
                  ) : (
                    <div className="bg-slate-800/40 border border-emerald-500/30 rounded-xl p-2.5 flex items-center gap-2 text-xs text-emerald-400">
                      <span>✓ 단독 앱 모드로 설치되어 실행 중입니다.</span>
                    </div>
                  )}

                  {/* 1. 스마트폰 시스템 알림음(알림 볼륨) 설정 */}
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3.5">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="font-bold text-amber-300 flex items-center gap-1.5">
                        <Smartphone className="w-4 h-4" /> 📱 스마트폰 알림 소리(알림 볼륨)
                      </span>
                      <span className={`text-[11px] px-2 py-0.5 rounded font-bold ${
                        notifPermission === 'granted' 
                          ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                          : 'bg-red-500/20 text-red-300 border border-red-500/40'
                      }`}>
                        {notifPermission === 'granted' ? '허용됨 (알림음 작동)' : '미허용'}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400 mb-2 leading-relaxed">
                      미디어 음량이 아닌 스마트폰의 <strong>[알림 볼륨]</strong>으로 알람 소리와 진동을 출력합니다.
                    </p>
                    {notifPermission !== 'granted' && (
                      <button
                        onClick={requestNotificationPermission}
                        className="w-full py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow transition-all"
                      >
                        <Bell className="w-3.5 h-3.5" /> 알림 권한 허용하기
                      </button>
                    )}
                  </div>

                  {/* 2. 알람 소리 선택 섹션 */}
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3.5">
                    <label className="font-bold text-red-400 block mb-2 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">
                        <Volume2 className="w-4 h-4" /> 🔔 알람 소리 종류 (화면 내 재생)
                      </span>
                      <button
                        onClick={() => playSingleAlarmBeep(tempSoundType)}
                        className="px-2 py-0.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold flex items-center gap-1 transition-all active:scale-95"
                      >
                        <Volume2 className="w-3 h-3" /> 미리듣기
                      </button>
                    </label>
                    
                    <div className="space-y-1.5">
                      {SOUND_OPTIONS.map((opt) => (
                        <div
                          key={opt.id}
                          onClick={() => setTempSoundType(opt.id)}
                          className={`p-2.5 rounded-lg border cursor-pointer flex items-center justify-between transition-all ${
                            tempSoundType === opt.id
                              ? 'bg-red-950/40 border-red-500/70 text-white'
                              : 'bg-slate-900/80 border-slate-700/70 text-slate-400 hover:bg-slate-800'
                          }`}
                        >
                          <div>
                            <div className="font-bold text-xs flex items-center gap-1.5">
                              {opt.name}
                              {tempSoundType === opt.id && <span className="text-[10px] text-red-400 font-normal">● 선택됨</span>}
                            </div>
                            <div className="text-[11px] text-slate-400 mt-0.5">{opt.desc}</div>
                          </div>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              playSingleAlarmBeep(opt.id);
                            }}
                            className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                            title="이 소리 테스트"
                          >
                            <Volume2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 3. 휴식 시간 설정 섹션 */}
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3.5">
                    <label className="font-bold text-emerald-400 block mb-1.5 flex items-center justify-between">
                      <span>⏱️ 세트 간 휴식 시간 (초 단위)</span>
                      <span className="text-white text-xs">{tempRestTime}초 ({Math.floor(tempRestTime/60)}분 {tempRestTime%60 ? (tempRestTime%60)+'초' : ''})</span>
                    </label>
                    <div className="flex items-center gap-2">
                      <input 
                        type="number" 
                        min="5" 
                        max="600" 
                        step="5"
                        value={tempRestTime}
                        onChange={(e) => setTempRestTime(Math.max(5, parseInt(e.target.value, 10) || 5))}
                        className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-center text-white font-bold focus:outline-none focus:border-emerald-500"
                      />
                      <div className="flex gap-1 flex-1">
                        {[60, 90, 120, 150, 180].map((sec) => (
                          <button
                            key={sec}
                            onClick={() => setTempRestTime(sec)}
                            className={`flex-1 py-1 rounded-lg text-[11px] font-semibold border transition-all ${
                              tempRestTime === sec 
                                ? 'bg-emerald-600 border-emerald-400 text-white' 
                                : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            {sec}초
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* 4. 운동 목록 편집 섹션 */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="font-bold text-indigo-300">🏋️ 등록된 운동 목록 ({tempRoutine.length}개)</span>
                      <button
                        onClick={handleAddExercise}
                        className="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1 transition-all shadow-sm active:scale-95"
                      >
                        <Plus className="w-3.5 h-3.5" /> 운동 추가
                      </button>
                    </div>

                    <div className="space-y-2.5">
                      {tempRoutine.map((ex, idx) => (
                        <div key={ex.id || idx} className="bg-slate-800/80 border border-slate-700/70 rounded-xl p-3 flex flex-col gap-2 relative">
                          
                          <div className="flex items-center justify-between">
                            <span className="text-[11px] font-bold text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/40">
                              #{idx + 1}번 운동
                            </span>
                            <div className="flex items-center gap-1">
                              <button 
                                onClick={() => handleMoveExercise(idx, -1)}
                                disabled={idx === 0}
                                className="p-1 rounded bg-slate-900 hover:bg-slate-700 text-slate-300 disabled:opacity-30"
                                title="위로 이동"
                              >
                                <ArrowUp className="w-3.5 h-3.5" />
                              </button>
                              <button 
                                onClick={() => handleMoveExercise(idx, 1)}
                                disabled={idx === tempRoutine.length - 1}
                                className="p-1 rounded bg-slate-900 hover:bg-slate-700 text-slate-300 disabled:opacity-30"
                                title="아래로 이동"
                              >
                                <ArrowDown className="w-3.5 h-3.5" />
                              </button>
                              <button 
                                onClick={() => handleRemoveExercise(idx)}
                                className="p-1 rounded bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/40 ml-1"
                                title="운동 삭제"
                              >
                                <Trash className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-400 block mb-0.5">운동 이름</label>
                            <input 
                              type="text" 
                              value={ex.name}
                              onChange={(e) => handleExerciseChange(idx, 'name', e.target.value)}
                              placeholder="예: 덤벨 프레스"
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold focus:outline-none focus:border-indigo-500"
                            />
                          </div>

                          <div className="grid grid-cols-3 gap-2">
                            <div>
                              <label className="text-[10px] text-slate-400 block mb-0.5">세트 수</label>
                              <input 
                                type="number" 
                                min="1"
                                max="20"
                                value={ex.sets}
                                onChange={(e) => handleExerciseChange(idx, 'sets', Math.max(1, parseInt(e.target.value, 10) || 1))}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-center text-white font-bold focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-slate-400 block mb-0.5">무게/강도</label>
                              <input 
                                type="text" 
                                value={ex.weight}
                                onChange={(e) => handleExerciseChange(idx, 'weight', e.target.value)}
                                placeholder="예: 14kg 양손"
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-slate-400 block mb-0.5">횟수/목표</label>
                              <input 
                                type="text" 
                                value={ex.reps}
                                onChange={(e) => handleExerciseChange(idx, 'reps', e.target.value)}
                                placeholder="예: 12회"
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-500 block mb-0.5">유튜브 자세 검색어</label>
                            <input 
                              type="text" 
                              value={ex.query || ''}
                              onChange={(e) => handleExerciseChange(idx, 'query', e.target.value)}
                              placeholder="예: 덤벨+프레스+자세"
                              className="w-full bg-slate-950/70 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-indigo-500"
                            />
                          </div>

                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* 모달 하단 버튼 바 */}
                <div className="p-3.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between gap-2">
                  <button
                    onClick={resetToDefault}
                    className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center gap-1 transition-all"
                  >
                    <RotateCcw className="w-3.5 h-3.5" /> 기본값 초기화
                  </button>

                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsSettingOpen(false)}
                      className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-all"
                    >
                      취소
                    </button>
                    <button
                      onClick={saveSettings}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-md shadow-indigo-600/30"
                    >
                      저장 및 적용
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Service Worker 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).then((registration) => {
          console.log('ServiceWorker registration successful');
          registration.update();
        }).catch((err) => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
